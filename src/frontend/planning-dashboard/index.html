<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规划人员（专班）看板 · 链式智能招商推荐系统</title>
<!-- 作者：赵帅臣（3240102154 · 软工 2402 班） · 方案生成岗 -->
<style>
:root{
  --primary:#1f4e79; --primary-light:#2e6da4; --bg:#f4f6f9; --card:#fff;
  --border:#dce3ec; --text:#1f2d3d; --text-sub:#5b6b7b; --text-muted:#8a97a5;
  --ok:#2e9e5b; --warn:#e8912b; --danger:#d9534f; --info:#3a7bd5;
  --tag-bg:#eef3f9; --shadow:0 2px 10px rgba(31,77,121,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer}

/* ===== 顶部导航 ===== */
.topbar{height:56px;background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 24px;gap:28px}
.topbar .logo{font-size:17px;font-weight:700;letter-spacing:.5px}
.topbar .views{display:flex;gap:6px}
.topbar .views button{background:transparent;border:none;color:#cfdcec;padding:8px 14px;border-radius:6px;font-size:14px}
.topbar .views button.active{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.topbar .views button:disabled{opacity:.55;cursor:not-allowed}
.topbar .spacer{flex:1}
.topbar .user{font-size:13px;color:#e6eef7}

/* ===== 布局 ===== */
.layout{display:flex;gap:16px;padding:16px 24px;align-items:flex-start}
.sidebar{width:280px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:14px}
.main{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:16px}

.sidebar h3,.main h3{font-size:15px;margin-bottom:12px;color:var(--primary)}
.task-item{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.task-item:hover{border-color:var(--primary-light)}
.task-item.selected{border-color:var(--primary);background:#f0f6fc}
.task-item .t-title{font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.task-item .t-desc{font-size:12.5px;color:var(--text-sub);line-height:1.5;margin-bottom:8px}
.task-item .t-meta{display:flex;gap:10px;font-size:12px;color:var(--text-muted)}

/* ===== 徽标 ===== */
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--tag-bg);color:var(--text-sub)}
.tag.high{background:#fdecec;color:var(--danger)}
.tag.mid{background:#fdf3e3;color:var(--warn)}
.tag.low{background:#eef1f4;color:var(--text-muted)}
.tag.status-draft{background:#eaf3fc;color:var(--info)}
.tag.status-in_review{background:#fdf3e3;color:var(--warn)}
.tag.status-finalized{background:#e9f6ee;color:var(--ok)}
.tag.status-pending{background:#eef1f4;color:var(--text-muted)}
.tag.status-failed{background:#fdecec;color:var(--danger)}
.tag.gen-llm{background:#f0ecfa;color:#6c5ce7}
.tag.gen-template{background:#fef0e6;color:var(--warn)}

/* ===== Tabs ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs button{background:none;border:none;padding:10px 18px;font-size:14px;color:var(--text-sub);border-bottom:2px solid transparent}
.tabs button.active{color:var(--primary);font-weight:600;border-bottom-color:var(--primary)}

/* ===== 表格 ===== */
.table-wrap{overflow-x:auto}
table{width:100%;min-width:1080px;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle;white-space:normal}
th{font-size:12.5px;color:var(--text-sub);font-weight:600;background:#f8fafc}
tr:hover td{background:#fafcff}
col.c-name{width:170px} col.c-node{width:130px} col.c-tags{width:170px}
col.c-score{width:80px} col.c-reason{width:230px} col.c-risk{width:190px}
col.c-status{width:90px} col.c-act{width:150px}
.score-pill{font-weight:700;color:var(--primary)}
.btn{border:1px solid var(--primary-light);background:#fff;color:var(--primary-light);border-radius:6px;padding:6px 12px;font-size:13px}
.btn:hover{background:#f0f6fc}
.btn.primary{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}
.btn.primary:hover{background:var(--primary)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cell-actions{display:flex;gap:6px;flex-wrap:wrap}

.filter-bar{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff}

/* ===== 抽屉 ===== */
.drawer-mask{position:fixed;inset:0;background:rgba(20,35,50,.35);display:none;z-index:20}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:680px;background:#fff;z-index:21;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-4px 0 18px rgba(0,0,0,.15)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drawer-head h2{font-size:16px;color:var(--primary)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.close-x{background:none;border:none;font-size:20px;color:var(--text-muted)}

.section{margin-bottom:20px}
.section h4{font-size:14px;color:var(--primary);margin-bottom:10px;padding-left:8px;border-left:3px solid var(--primary-light)}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile-card{border:1px solid var(--border);border-radius:8px;padding:10px}
.profile-card .pc-title{font-size:12.5px;color:var(--text-sub);margin-bottom:6px}
.profile-card .pc-body{font-size:13px;line-height:1.6}
.profile-card .pc-source{font-size:11px;color:var(--text-muted);margin-top:4px}

.score-row{display:flex;gap:18px;align-items:center;margin-bottom:10px}
.score-big{font-size:26px;font-weight:700;color:var(--primary)}
.dim-bar{margin:6px 0}
.dim-bar .dim-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-sub);margin-bottom:3px}
.dim-bar .track{height:7px;background:#eef1f4;border-radius:4px;overflow:hidden}
.dim-bar .fill{height:100%;background:var(--primary-light);border-radius:4px}

.policy-item{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.policy-item .p-name{font-weight:600;margin-bottom:5px}
.policy-item .p-clause{font-size:13px;color:var(--text-sub);line-height:1.6;margin-bottom:6px}
.policy-item .p-meta{font-size:12px;color:var(--text-muted)}
.policy-item .p-reason{font-size:12.5px;color:var(--info);margin-top:5px}

.plan-block{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.plan-block ol,.plan-block ul{padding-left:20px;line-height:1.8}
.step{border-left:2px solid var(--border);padding:0 0 12px 14px;position:relative}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary-light)}
.step .s-stage{font-weight:600;margin-bottom:4px}
.step .s-meta{font-size:12px;color:var(--text-muted)}

.timeline{border-left:2px solid var(--border);padding-left:16px}
.timeline .tl-item{position:relative;margin-bottom:14px}
.timeline .tl-item::before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary-light)}
.timeline .tl-time{font-size:12px;color:var(--text-muted)}

.source-note{font-size:12px;color:var(--text-muted);background:#f8fafc;border-radius:6px;padding:8px 10px;margin-top:8px}
.ai-banner{background:#fff8ec;border:1px solid #f3d9a8;color:#8a6210;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}

/* ===== Toast / Modal ===== */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:8px;z-index:40;font-size:13px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.modal-mask{position:fixed;inset:0;background:rgba(20,35,50,.35);z-index:30;display:none;align-items:center;justify-content:center}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:10px;width:420px;padding:20px}
.modal h3{font-size:15px;margin-bottom:12px}
.modal textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:inherit;font-size:13px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}

.empty{padding:30px;text-align:center;color:var(--text-muted)}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #cfdcec;border-top-color:var(--primary-light);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 顶部导航：三视图由共享框架（T9）提供，本视图默认定位规划人员 -->
<header class="topbar">
  <div class="logo">链式智能招商推荐系统</div>
  <nav class="views">
    <button disabled>决策领导看板</button>
    <button disabled>招商专员看板</button>
    <button class="active">规划人员看板</button>
  </nav>
  <div class="spacer"></div>
  <div class="user">专班规划人员 · 张工　|　2026-11-24</div>
</header>

<div class="layout">
  <!-- 左侧：补链任务列表（消费 D1） -->
  <aside class="sidebar">
    <h3>补链任务（短板识别 D1）</h3>
    <div id="taskList"></div>
  </aside>

  <!-- 主工作区 -->
  <main class="main">
    <div class="tabs">
      <button id="tabCandidates" class="active" onclick="switchTab('candidates')">候选企业清单</button>
      <button id="tabPlans" onclick="switchTab('plans')">方案台账</button>
    </div>

    <!-- Tab1：候选企业 -->
    <section id="paneCandidates">
      <div class="filter-bar">
        <select id="scoreFilter" onchange="renderCandidates()">
          <option value="">全部适配分</option>
          <option value="80">≥ 80 分</option>
          <option value="70">≥ 70 分</option>
        </select>
        <span id="candCount" style="font-size:12.5px;color:var(--text-muted)"></span>
      </div>
      <div class="table-wrap">
      <table>
        <colgroup>
          <col class="c-name"><col class="c-node"><col class="c-tags"><col class="c-score">
          <col class="c-reason"><col class="c-risk"><col class="c-status"><col class="c-act">
        </colgroup>
        <thead>
          <tr>
            <th>企业</th><th>产业链环节</th><th>画像标签</th><th>适配总分</th>
            <th>命中原因（D2）</th><th>风险提示（D4）</th><th>方案状态</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="candidateBody"></tbody>
      </table>
      </div>
    </section>

    <!-- Tab2：方案台账 -->
    <section id="panePlans" style="display:none">
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>方案编号</th><th>企业</th><th>补链任务</th><th>状态</th><th>生成方式</th>
            <th>最近更新</th><th>版本</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="planBody"></tbody>
      </table>
      </div>
    </section>
  </main>
</div>

<!-- 详情抽屉 -->
<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">方案详情</h2>
    <button class="close-x" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<!-- 驳回意见弹窗 -->
<div class="modal-mask" id="rejectModal">
  <div class="modal">
    <h3>驳回方案</h3>
    <textarea id="rejectComment" placeholder="驳回意见必填：说明与数据库 / 政策来源不符之处…"></textarea>
    <div class="m-foot">
      <button class="btn" onclick="closeRejectModal()">取消</button>
      <button class="btn danger" onclick="confirmReject()">确认驳回</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="mock-api.js"></script>

<script>
/* 页面渲染与交互逻辑；样例数据与接口调用见 mock-api.js（接口定稿后替换为 api-client.js）。 */


/* ---------- 状态与渲染 ---------- */
let selectedTask = null;
let activeTab = "candidates";
let currentPlanId = null;
let pendingRejectPlanId = null;

const STATUS_TEXT = { pending:"待生成", draft:"草稿", in_review:"待审核", finalized:"已定稿", failed:"生成失败", archived:"已归档" };
const PRIORITY_TAG = { "高":"high", "中":"mid", "低":"low" };

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

function switchTab(tab){
  activeTab = tab;
  document.getElementById("tabCandidates").classList.toggle("active", tab==="candidates");
  document.getElementById("tabPlans").classList.toggle("active", tab==="plans");
  document.getElementById("paneCandidates").style.display = tab==="candidates" ? "" : "none";
  document.getElementById("panePlans").style.display = tab==="plans" ? "" : "none";
  if (tab==="plans") renderPlans();
}

async function renderTasks(){
  const tasks = await MockAPI.listShortboards();
  const box = document.getElementById("taskList");
  box.innerHTML = tasks.map(t => `
    <div class="task-item ${selectedTask===t.shortboard_id?"selected":""}" onclick="selectTask('${t.shortboard_id}')">
      <div class="t-title"><span>${t.link_node}</span><span class="tag ${PRIORITY_TAG[t.priority]}">${t.priority}</span></div>
      <div class="t-desc">${t.gap_desc}</div>
      <div class="t-meta"><span>${t.gap_type}</span><span>候选 ${t.candidate_count} 家</span><span>已定稿 ${t.plan_done_count} 份</span></div>
    </div>`).join("");
}

function selectTask(id){ selectedTask = selectedTask===id ? null : id; renderTasks(); renderCandidates(); }

function findEnt(id){ return DB.enterprises.find(e => String(e.enterprise_id) === String(id)); }
function planOfEnterprise(entId){ return DB.plans.find(p => String(p.enterprise_id) === String(entId)); }

async function renderCandidates(){
  const list = await MockAPI.listCandidates(selectedTask);
  const minScore = document.getElementById("scoreFilter").value;
  const rows = list.filter(e => !minScore || (e.fit_score ?? 0) >= Number(minScore));
  document.getElementById("candCount").textContent = `共 ${rows.length} 家候选企业`;
  const body = document.getElementById("candidateBody");
  if (!rows.length){ body.innerHTML = `<tr><td colspan="8"><div class="empty">当前条件下暂无候选企业</div></td></tr>`; return; }
  body.innerHTML = rows.map(e => {
    const plan = planOfEnterprise(e.enterprise_id);
    const status = plan ? plan.status : "pending";
    const scoreCell = e.fit_score==null ? '<span style="color:var(--text-muted)">待评分</span>' : `<span class="score-pill">${e.fit_score}</span>`;
    const genLabel = e.fit_score==null ? "生成方案（待评分）" : "生成方案";
    return `<tr>
      <td><strong>${e.name}</strong></td>
      <td>${e.link_node}</td>
      <td>${(e.tags||[]).map(t=>`<span class="tag">${t}</span>`).join(" ")}</td>
      <td>${scoreCell}</td>
      <td style="max-width:240px">${e.hit_reason}</td>
      <td style="max-width:200px;color:var(--text-sub)">${e.risk_note || "—"}</td>
      <td><span class="tag status-${status}">${STATUS_TEXT[status]}</span></td>
      <td class="cell-actions">
        ${plan ? `<button class="btn sm" onclick="openPlan('${plan.plan_id}')">查看方案</button>`
               : `<button class="btn sm primary" onclick="generatePlan('${e.enterprise_id}','${e.shortboard_id}')">${genLabel}</button>`}
      </td>
    </tr>`;
  }).join("");
}

async function renderPlans(){
  const plans = await MockAPI.listPlans();
  const body = document.getElementById("planBody");
  if (!plans.length){ body.innerHTML = `<tr><td colspan="8"><div class="empty">暂无方案记录</div></td></tr>`; return; }
  body.innerHTML = plans.map(p => {
    const ent = findEnt(p.enterprise_id);
    const sb = DB.shortboards.find(s => s.shortboard_id === p.shortboard_id);
    return `<tr>
      <td>${p.plan_id}</td><td>${ent?ent.name:"—"}</td><td>${sb?sb.link_node:"—"}</td>
      <td><span class="tag status-${p.status}">${STATUS_TEXT[p.status]}</span></td>
      <td><span class="tag gen-${p.generator}">${p.generator==="llm"?"LLM":"模板兜底"}</span></td>
      <td>${p.updated_at}</td><td>v${p.current_version_no}</td>
      <td class="cell-actions">
        <button class="btn sm" onclick="openPlan('${p.plan_id}')">查看</button>
        <button class="btn sm" onclick="regenerate('${p.plan_id}')">重新生成</button>
        <button class="btn sm" onclick="exportPlan('${p.plan_id}')">导出</button>
      </td></tr>`;
  }).join("");
}

/* ---------- 方案生成 / 详情抽屉 ---------- */
async function generatePlan(entId, sbId){
  const ent = findEnt(entId);
  if (ent.fit_score == null){ toast("评分待 D4 补充，先按画像与政策生成草稿"); }
  else { toast("正在汇总画像、评分与政策并生成方案…"); }
  const plan = await MockAPI.generatePlan(entId, sbId);
  toast("方案草稿已生成，待人工核验");
  openPlan(plan.plan_id);
  renderCandidates();
}

async function regenerate(planId){
  toast("正在重新生成新版本…");
  const plan = await MockAPI.regenerate(planId);
  toast("已生成新版本，旧版本归档只读");
  openPlan(plan.plan_id);
  renderPlans();
}

function openPlan(planId){
  const plan = DB.plans.find(p => p.plan_id === planId);
  if (!plan) return;
  currentPlanId = planId;
  const ent = findEnt(plan.enterprise_id);
  const sb = DB.shortboards.find(s => s.shortboard_id === plan.shortboard_id);
  document.getElementById("drawerTitle").textContent = `招商方案 · ${ent.name}`;

  const p = plan.plan;
  document.getElementById("drawerBody").innerHTML = `
    <div class="ai-banner">${plan.generator==="llm" ? "AI 生成内容，待人工核验；方案数据取自数据库，定稿前请逐条核对来源。" : "模板兜底生成（LLM 不可用），同样需人工核验。"}　生成方式：${plan.generator==="llm"?"LLM":"规则模板"} · 模型/模板版本：${plan.model_version||plan.template_id}</div>

    <div class="section">
      <h4>补链关联（D1）</h4>
      <div>${sb.link_node}　<span class="tag">${sb.gap_type}</span></div>
      <div class="source-note">${sb.gap_desc}　依据：${sb.basis_source}</div>
    </div>

    <div class="section">
      <h4>企业画像（D3 · 6 维）</h4>
      <div class="profile-grid">
        ${profileCard("基础信息", ent.profile.basic)}
        ${profileCard("经营规模", ent.profile.scale)}
        ${profileCard("行业环节", ent.profile.link)}
        ${profileCard("地域布局", ent.profile.region)}
        ${profileCard("技术 / 资质", ent.profile.tech)}
        ${profileCard("投资动向", ent.profile.investment)}
      </div>
    </div>

    <div class="section">
      <h4>适配评分（D4）</h4>
      ${ent.fit_score==null ? '<div class="empty">暂无评分记录</div>' : `
        <div class="score-row">
          <div class="score-big">${ent.fit_score}</div>
          <div style="color:var(--text-sub);font-size:13px">适配总分（0–100）　${ent.risk_note ? `风险提示：${ent.risk_note}` : ""}</div>
        </div>
        ${Object.entries(ent.dimension_scores).map(([k,v])=>dimBar(k,v)).join("")}
        <div class="source-note">评分理由：${ent.hit_reason}</div>
      `}
    </div>

    <div class="section">
      <h4>推介要点</h4>
      <div class="plan-block"><ul>${p.highlights.map(h=>`<li>${h}</li>`).join("")}</ul></div>
    </div>

    <div class="section">
      <h4>匹配政策包</h4>
      ${p.matched_policies.length ? p.matched_policies.map(po=>`
        <div class="policy-item">
          <div class="p-name">${po.name}　<span class="tag">${po.match_dimension}</span></div>
          <div class="p-clause">${po.clause}</div>
          <div class="p-reason">匹配理由：${po.match_reason}</div>
          <div class="p-meta">来源：${po.source}</div>
        </div>`).join("") : '<div class="empty">暂未匹配到适用政策</div>'}
    </div>

    <div class="section">
      <h4>谈判策略</h4>
      <div class="plan-block"><ul>${p.negotiation_points.map(n=>`<li>${n}</li>`).join("")}</ul></div>
    </div>

    <div class="section">
      <h4>分步行动计划</h4>
      ${p.action_steps.map(s=>`
        <div class="step">
          <div class="s-stage">${s.stage}</div>
          <div>${s.actions.map(a=>`· ${a}`).join("<br>")}</div>
          <div class="s-meta">建议责任：${s.owner_suggest||"—"}　|　时间建议：${s.timeline||"—"}</div>
        </div>`).join("")}
    </div>

    <div class="section">
      <h4>版本与留痕</h4>
      <div class="timeline">
        ${plan.versions.map(v=>`
          <div class="tl-item">
            <div><strong>v${v.version_no}</strong>　<span class="tag gen-${v.generator}">${v.generator==="llm"?"LLM":"模板"}</span>　<span class="tag status-${v.status}">${STATUS_TEXT[v.status]}</span></div>
            <div class="tl-time">${v.created_at}</div>
            <div style="font-size:12.5px;color:var(--text-sub)">${v.note||""}</div>
          </div>`).join("")}
      </div>
      ${plan.review.reviewer ? `<div class="source-note">核验人：${plan.review.reviewer}　核验时间：${plan.review.reviewed_at}　意见：${plan.review.comment||"—"}</div>` : ""}
      <div class="source-note">上下文快照：${JSON.stringify(plan.context_ref)}　留痕：${JSON.stringify(plan.trace)}</div>
    </div>`;

  renderFoot(plan);
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerMask").classList.add("open");
}

const FIELD_LABELS = {
  established:"成立年份", founded_year:"成立年份", registered_capital:"注册资本", reg_capital:"注册资本（万元）",
  location:"所在地", region:"注册地", legal_person:"法定代表人", credit_code:"统一社会信用代码",
  employees:"员工人数", employee_scale:"员工规模", revenue_band:"营收区间", revenue_scale:"营收规模",
  industry:"所属行业", industry_name:"行业名称", industry_code:"行业代码", node:"产业链环节",
  chain_segment:"产业链环节", tags:"标签", current_layout:"现有布局", production_bases:"生产基地",
  expansion_region:"扩张区域", factor_needs:"要素需求", qualifications:"资质认证", patents:"专利数", recent_move:"投资动向"
};
function profileCard(title, dim){
  const val = dim.value;
  const body = val==null ? "数据待补充" : Object.entries(val).map(([k,v])=>{
    const label = FIELD_LABELS[k] || k;
    const display = Array.isArray(v) ? v.join("、") : (v ?? "—");
    return `<div>${label}：${display}</div>`;
  }).join("");
  return `<div class="profile-card"><div class="pc-title">${title}</div><div class="pc-body">${body}</div><div class="pc-source">来源：${dim.source||"—"}</div></div>`;
}
function dimBar(k,v){
  const label = { industry_fit:"产业契合度", factor_match:"要素匹配", policy_match:"政策匹配", risk_control:"风险可控" }[k]||k;
  return `<div class="dim-bar"><div class="dim-label"><span>${label}</span><span>${v}</span></div><div class="track"><div class="fill" style="width:${v}%"></div></div></div>`;
}

function renderFoot(plan){
  const foot = document.getElementById("drawerFoot");
  let btns = [];
  if (plan.status==="draft") btns.push(`<button class="btn primary" onclick="submitReview('${plan.plan_id}')">提交审核</button>`);
  if (plan.status==="in_review"){
    btns.push(`<button class="btn ok" onclick="finalize('${plan.plan_id}')">采纳定稿</button>`);
    btns.push(`<button class="btn danger" onclick="openReject('${plan.plan_id}')">驳回</button>`);
  }
  btns.push(`<button class="btn" onclick="regenerate('${plan.plan_id}')">重新生成</button>`);
  btns.push(`<button class="btn" onclick="exportPlan('${plan.plan_id}')">导出 Markdown</button>`);
  foot.innerHTML = btns.join("");
}

function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawerMask").classList.remove("open");
  currentPlanId = null;
}

function submitReview(planId){
  const plan = DB.plans.find(p=>p.plan_id===planId);
  plan.status = "in_review"; plan.updated_at = nowStr();
  toast("已提交审核"); closeDrawer(); renderPlans(); renderCandidates();
}
function finalize(planId){
  const plan = DB.plans.find(p=>p.plan_id===planId);
  plan.status = "finalized"; plan.updated_at = nowStr();
  plan.review = { reviewer:"专班 · 张工", reviewed_at:nowStr(), comment:"数据与政策来源核对一致，同意定稿。" };
  toast("方案已定稿"); closeDrawer(); renderPlans(); renderCandidates();
}
function openReject(planId){ pendingRejectPlanId = planId; document.getElementById("rejectComment").value=""; document.getElementById("rejectModal").classList.add("open"); }
function closeRejectModal(){ document.getElementById("rejectModal").classList.remove("open"); pendingRejectPlanId=null; }
function confirmReject(){
  const comment = document.getElementById("rejectComment").value.trim();
  if (!comment){ toast("驳回意见必填"); return; }
  const plan = DB.plans.find(p=>p.plan_id===pendingRejectPlanId);
  plan.status = "draft"; plan.updated_at = nowStr();
  plan.review = { reviewer:"专班 · 张工", reviewed_at:nowStr(), comment };
  toast("已驳回，退回草稿"); closeRejectModal(); closeDrawer(); renderPlans(); renderCandidates();
}

/* ---------- 导出 Markdown ---------- */
function exportPlan(planId){
  const plan = DB.plans.find(p=>p.plan_id===planId);
  const ent = findEnt(plan.enterprise_id);
  const sb = DB.shortboards.find(s=>s.shortboard_id===plan.shortboard_id);
  const p = plan.plan;
  const md = [
    `# 招商方案 · ${ent.name}`,
    ``, `方案编号：${plan.plan_id}　|　补链任务：${sb.link_node}　|　状态：${STATUS_TEXT[plan.status]}　|　生成方式：${plan.generator==="llm"?"LLM":"规则模板"}`,
    ``, `## 一、推介要点`, ...p.highlights.map(h=>`- ${h}`),
    ``, `## 二、匹配政策包`, ...p.matched_policies.flatMap(po=>[`### ${po.name}`,`- 条款：${po.clause}`,`- 匹配维度：${po.match_dimension}`,`- 匹配理由：${po.match_reason}`,`- 来源：${po.source}`]),
    ``, `## 三、谈判策略`, ...p.negotiation_points.map(n=>`- ${n}`),
    ``, `## 四、分步行动计划`, ...p.action_steps.flatMap(s=>[`### ${s.stage}`,`- ${s.actions.join("；")}`,`- 建议责任：${s.owner_suggest||"—"}　时间建议：${s.timeline||"—"}`]),
    ``, `## 五、核验信息`, `- 核验人：${plan.review.reviewer||"待核验"}　核验时间：${plan.review.reviewed_at||"—"}`, `- 意见：${plan.review.comment||"—"}`,
    ``, `> 本文档数据取自业务数据库；AI 生成内容已经/待人工核验。`
  ].join("\n");
  const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${plan.plan_id}_招商方案.md`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 Markdown 文件");
}

/* ---------- 初始化 ---------- */
renderTasks(); renderCandidates();
</script>
